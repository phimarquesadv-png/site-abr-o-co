name: Prévia do PR

# Publica cada PR numa URL própria do Cloudflare, para conferir a mudança no
# navegador antes do merge. Não toca na produção: `versions upload` cria uma
# versão nova sem promovê-la para a rota principal.
on:
  pull_request:

concurrency:
  group: previa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previa:
    name: Publicar prévia
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Necessário para o comentário com o link.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Subir versão de prévia
        id: subir
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --message "PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}" \
            2>&1 | tee saida.txt

          # O wrangler imprime a URL de prévia; extraímos para o comentário.
          url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' saida.txt | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comentar o link no PR
        if: steps.subir.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.subir.outputs.url) }};
            const marca = '<!-- previa-claude -->';
            const corpo = `${marca}\n**Prévia deste PR:** ${url}\n\n` +
              `Publicada a partir do commit \`${context.sha.slice(0, 7)}\`. ` +
              `É uma versão isolada — não afeta o site em produção.`;

            const { data: existentes } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            // Atualiza o comentário anterior em vez de empilhar um por push.
            const anterior = existentes.find(c => c.body?.includes(marca));
            if (anterior) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: anterior.id, body: corpo,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body: corpo,
              });
            }
